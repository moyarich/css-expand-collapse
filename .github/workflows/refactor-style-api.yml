name: Refactor style declaration API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ github.event.head_commit.message == 'fix: run style api refactor' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rename and update API
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          old_file = root / 'packages/css-expand-collapse/src/computed.ts'
          new_file = root / 'packages/css-expand-collapse/src/style.ts'
          old_file.rename(new_file)

          replacements = [
              ('collapseComputedStyles', 'collapseStyleDeclarations'),
              ('collapseComputedStyle', 'collapseStyleDeclaration'),
              ('getComputedLonghands', 'getStyleLonghands'),
              ('./computed.js', './style.js'),
              ('computed.ts', 'style.ts'),
              ('get-computed-longhands', 'get-style-longhands'),
              ('collapse-computed-styles', 'collapse-style-declarations'),
              ('collapse-computed-style', 'collapse-style-declaration'),
              ('Convert a read-only computed-style shape to a plain declaration map.',
               'Convert a read-only style declaration to a plain declaration map.'),
              ('Read only the computed longhands registered for one shorthand.',
               'Read the registered longhands for one shorthand from a read-only style declaration.'),
              ('Collapse one shorthand from a read-only computed-style shape.',
               'Collapse one shorthand from a read-only style declaration.'),
              ('Collapse multiple requested shorthands from one computed-style shape.',
               'Collapse multiple requested shorthands from one read-only style declaration.'),
              ('describe("computed style",', 'describe("style declarations",'),
              ('it("can consume the CSSStyleDeclaration shape returned by getComputedStyle",',
               'it("can consume a read-only CSSStyleDeclaration-like object",'),
              ('## Computed styles\n\nIn a browser, the package can work directly with the read-only shape returned by `getComputedStyle()`:',
               '## Style declarations\n\nThe style-declaration APIs accept any read-only `CSSStyleDeclaration`-like object, including the value returned by `getComputedStyle()`:'),
              ('## `getComputedStyle()`\n\nThe package accepts the same read-only shape returned by `window.getComputedStyle()`:',
               '## Style declarations\n\nThe package accepts a read-only style declaration interface compatible with `window.getComputedStyle()`:'),
              ('| Computed style |', '| Style declaration |'),
              ('Reads the computed longhands registered for one shorthand.',
               'Reads the registered longhands for one shorthand from a read-only style declaration.'),
              ('Collapses one shorthand from a computed/read-only style declaration.',
               'Collapses one shorthand from a read-only style declaration.'),
              ('Collapses multiple shorthands from a computed/read-only style declaration.',
               'Collapses multiple shorthands from a read-only style declaration.'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.md'}:
                  continue
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              text = path.read_text()
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY

      - name: Verify old API names are gone
        run: |
          if grep -R -n -E 'getComputedLonghands|collapseComputedStyle|collapseComputedStyles|from "\./computed\.js"' packages apps README.md docs --include='*.ts' --include='*.tsx' --include='*.md'; then
            echo 'Old style API names remain' >&2
            exit 1
          fi
          test ! -e packages/css-expand-collapse/src/computed.ts
          test -e packages/css-expand-collapse/src/style.ts

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "moyarich"
          git config user.email "moyarich@hotmail.com"
          git add -A
          git commit -m "refactor: generalize style declaration API"
          git push origin main
