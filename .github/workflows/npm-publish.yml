name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      registry:
        description: Publish destination
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
          - both
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: package-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_DIRECTORY: packages/css-expand-collapse
  NPM_ACCESS: public

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify version tag
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

  publish-github:
    needs: verify
    if: github.event_name == 'push' || inputs.registry == 'github' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Show package version
        run: node -p "'Publishing to GitHub Packages: ' + require('./${PACKAGE_DIRECTORY}/package.json').name + '@' + require('./${PACKAGE_DIRECTORY}/package.json').version"

      - name: Publish to GitHub Packages
        env:
          PRIMARY_GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          FALLBACK_GITHUB_TOKEN: ${{ secrets._NODE_AUTH_TOKEN }}
          NPM_REGISTRY: https://npm.pkg.github.com
          NPM_TAG: ${{ inputs.tag }}
        run: |
          export _GITHUB_TOKEN="${PRIMARY_GITHUB_TOKEN:-$FALLBACK_GITHUB_TOKEN}"
          npm run publish:lib

  stage-npm:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && (inputs.registry == 'npm' || inputs.registry == 'both')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure staged publishing CLI support
        run: npm install --global npm@">=11.15.0 <12"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Show package version
        run: node -p "'Staging on npmjs.org: ' + require('./${PACKAGE_DIRECTORY}/package.json').name + '@' + require('./${PACKAGE_DIRECTORY}/package.json').version"

      - name: Stage package on npmjs.org
        env:
          PRIMARY_NPM_TOKEN: ${{ secrets._NPM_TOKEN }}
          FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: https://registry.npmjs.org
          NPM_TAG: ${{ inputs.tag }}
        run: |
          export _NPM_TOKEN="${PRIMARY_NPM_TOKEN:-$FALLBACK_NPM_TOKEN}"
          npm run publish:lib
