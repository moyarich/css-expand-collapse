name: Apply module-owned shorthand initial values

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-shorthand-initial-values.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:lib

      - name: Apply module-owned initial values
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';
          import { getLonghands, SHORTHAND_PROPERTIES } from './packages/css-expand-collapse/dist/index.js';

          const require = createRequire(import.meta.url);
          const properties = require('mdn-data/css/properties.json');
          const root = 'packages/css-expand-collapse/src/registry/shorthands';
          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text);
          const literal = (values) => `[${values.map((value) => value === null ? 'null' : JSON.stringify(value)).join(', ')}] as const`;

          for (const shorthand of SHORTHAND_PROPERTIES) {
            const file = path.join(root, `${shorthand}.ts`);
            if (!fs.existsSync(file)) continue;
            let text = read(file);
            if (!text.includes('satisfies ShorthandModule')) continue;

            if (!text.includes('initialValues')) {
              const longhands = getLonghands(shorthand);
              const values = longhands.map((longhand) => {
                const initial = properties[longhand]?.initial;
                if (initial == null) throw new Error(`Missing initial value for ${shorthand} -> ${longhand}`);
                return initial === 'dependsOnUserAgent' ? null : initial;
              });

              if (shorthand === 'all') {
                text = text.replace('  longhands: [],\n', '  longhands: [],\n  initialValues: [],\n');
              } else {
                const declaration = `const initialValues = ${literal(values)};\n`;
                const expandIndex = text.indexOf('const expand');
                const exportIndex = text.indexOf('export default');
                const insertIndex = expandIndex >= 0 ? expandIndex : exportIndex;
                if (insertIndex < 0) throw new Error(`Unable to place initialValues in ${file}`);
                text = `${text.slice(0, insertIndex)}${declaration}${text.slice(insertIndex)}`;

                if (text.includes('export default { longhands, expand, collapse }')) {
                  text = text.replace('export default { longhands, expand, collapse }', 'export default { longhands, initialValues, expand, collapse }');
                } else if (text.includes('export default {\n  longhands,\n')) {
                  text = text.replace('export default {\n  longhands,\n', 'export default {\n  longhands,\n  initialValues,\n');
                } else {
                  throw new Error(`Unable to export initialValues from ${file}`);
                }
              }
            }

            text = text.replace(/expandTriple\(longhands\)/g, 'expandTriple(longhands, initialValues)');
            text = text.replace(/expandTriple\(longhands\.slice\(0, 3\)\)/g, 'expandTriple(longhands.slice(0, 3), initialValues.slice(0, 3))');
            text = text.replace(/expandLogicalBorderAxis\(longhands\)/g, 'expandLogicalBorderAxis(longhands, initialValues)');
            write(file, text);
          }

          const modulePath = 'packages/css-expand-collapse/src/registry/module.ts';
          let moduleText = read(modulePath);
          moduleText = moduleText.replace('  readonly initialValues?: readonly string[];', '  readonly initialValues: readonly (string | null)[];');
          write(modulePath, moduleText);

          const corePath = 'packages/css-expand-collapse/src/core.ts';
          let core = read(corePath);
          core = core.replace('  if (!shouldFill || !definition.initialValues) {\n    return completed;\n  }', '  if (!shouldFill) {\n    return completed;\n  }');
          core = core.replace('    const initialValue = definition.initialValues?.[index];\n    if (initialValue !== undefined) completed[longhand] = initialValue;', '    const initialValue = definition.initialValues[index];\n    if (typeof initialValue === "string") completed[longhand] = initialValue;');
          write(corePath, core);

          const cssPath = 'packages/css-expand-collapse/src/css.ts';
          write(cssPath, read(cssPath).replace('      definition.initialValues?.length === definition.longhands.length;', '      definition.initialValues.length === definition.longhands.length;'));

          const expandersPath = 'packages/css-expand-collapse/src/registry/expanders.ts';
          let expanders = read(expandersPath);
          const oldTriple = [
            'export function expandTriple(',
            '  longhands: readonly string[],',
            '  defaults: readonly [string, string, string] = ["medium", "none", "currentcolor"],',
            '): ShorthandExpander {',
            '  return (value, context) => {',
            '    const tokens = context.splitWhitespace(value);',
            '    if (!tokens.length) return null;',
            '',
            '    const result: DeclarationMap = {',
            '      [longhands[0]!]: defaults[0],',
            '      [longhands[1]!]: defaults[1],',
            '      [longhands[2]!]: defaults[2],',
            '    };',
          ].join('\n');
          const newTriple = [
            'export function expandTriple(',
            '  longhands: readonly string[],',
            '  initialValues: readonly string[],',
            '): ShorthandExpander {',
            '  return (value, context) => {',
            '    const tokens = context.splitWhitespace(value);',
            '    if (!tokens.length || longhands.length !== 3 || initialValues.length !== 3) return null;',
            '',
            '    const result: DeclarationMap = {',
            '      [longhands[0]!]: initialValues[0]!,',
            '      [longhands[1]!]: initialValues[1]!,',
            '      [longhands[2]!]: initialValues[2]!,',
            '    };',
          ].join('\n');
          if (!expanders.includes(oldTriple)) throw new Error('expandTriple source did not match');
          expanders = expanders.replace(oldTriple, newTriple);

          const oldLogical = [
            'export function expandLogicalBorderAxis(longhands: readonly string[]): ShorthandExpander {',
            '  const expandSide = expandTriple(longhands.slice(0, 3));',
            '',
            '  return (value, context) => {',
            '    if (longhands.length !== 6) return null;',
          ].join('\n');
          const newLogical = [
            'export function expandLogicalBorderAxis(',
            '  longhands: readonly string[],',
            '  initialValues: readonly string[],',
            '): ShorthandExpander {',
            '  const expandSide = expandTriple(longhands.slice(0, 3), initialValues.slice(0, 3));',
            '',
            '  return (value, context) => {',
            '    if (longhands.length !== 6 || initialValues.length !== 6) return null;',
          ].join('\n');
          if (!expanders.includes(oldLogical)) throw new Error('expandLogicalBorderAxis source did not match');
          write(expandersPath, expanders.replace(oldLogical, newLogical));

          const testPath = 'packages/css-expand-collapse/tests/registry-modules.test.ts';
          let test = read(testPath);
          test = test.replace(
            '      expect(Array.isArray(module.longhands)).toBe(true);\n      expect(typeof module.expand).toBe("function");',
            '      expect(Array.isArray(module.longhands)).toBe(true);\n      expect(Array.isArray(module.initialValues)).toBe(true);\n      expect(module.initialValues).toHaveLength(module.longhands.length);\n      expect(module.initialValues.every((value) => value === null || typeof value === "string")).toBe(true);\n      expect(typeof module.expand).toBe("function");',
          );
          test = test.replace('    expect(SHORTHAND_MODULES.all.longhands).toEqual([]);', '    expect(SHORTHAND_MODULES.all.longhands).toEqual([]);\n    expect(SHORTHAND_MODULES.all.initialValues).toEqual([]);');
          write(testPath, test);

          for (const file of ['docs/README-dev.md', 'packages/css-expand-collapse/src/registry/README.md']) {
            let text = read(file);
            text = text.replace('readonly initialValues?: readonly string[];', 'readonly initialValues: readonly (string | null)[];');
            text = text.replace('Declare its `longhands` and optional `initialValues`.', 'Declare its `longhands` and required `initialValues`.');
            write(file, text);
          }

          const missing = fs.readdirSync(root).filter((name) => name.endsWith('.ts')).filter((name) => {
            const text = read(path.join(root, name));
            return text.includes('satisfies ShorthandModule') && !text.includes('initialValues');
          });
          if (missing.length) throw new Error(`Modules still missing initialValues: ${missing.join(', ')}`);
          NODE

      - name: Verify ownership invariant
        run: |
          if grep -R "initialValues?:" packages/css-expand-collapse/src docs; then
            echo "Optional initialValues remain"
            exit 1
          fi
          if grep -R 'expandTriple(longhands)' packages/css-expand-collapse/src/registry/shorthands; then
            echo "Shared triple defaults are still being used"
            exit 1
          fi

      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/report-shorthand-initial-values.yml
          rm -f .github/workflows/derive-shorthand-initial-values.yml
          rm -f .github/workflows/apply-shorthand-initial-values.yml

      - name: Commit validated refactor
        run: |
          git config user.name "moyarich"
          git config user.email "moyarich@hotmail.com"
          git add packages/css-expand-collapse/src packages/css-expand-collapse/tests docs/README-dev.md .github/workflows
          git commit -m "refactor: make shorthand modules own initial values"
          git push
