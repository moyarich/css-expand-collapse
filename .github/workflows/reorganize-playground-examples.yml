name: Reorganize playground examples

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ github.event.head_commit.message == 'chore: reorganize playground examples' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reorganize examples
        run: |
          set -euo pipefail

          mkdir -p apps/playground/src/examples/CSSConverter
          mv apps/playground/src/examples/computedExport.ts apps/playground/src/examples/CSSConverter/computedExport.ts
          mv apps/playground/src/examples/shorthands.ts apps/playground/src/examples/CSSConverter/shorthands.ts
          mv apps/playground/src/examples/index.ts apps/playground/src/examples/CSSConverter/index.ts

          mv apps/playground/src/APIPlayground/examples apps/playground/src/examples/APIPlayground

          python3 <<'PY'
          from pathlib import Path

          app = Path('apps/playground/src/App.tsx')
          text = app.read_text()
          text = text.replace('} from "./examples";', '} from "./examples/CSSConverter";')
          app.write_text(text)

          api = Path('apps/playground/src/APIPlayground/APIPlayground.tsx')
          text = api.read_text()
          text = text.replace('from "./examples";', 'from "../examples/APIPlayground";')
          api.write_text(text)
          PY

      - name: Verify layout
        run: |
          test -d apps/playground/src/examples/CSSConverter
          test -d apps/playground/src/examples/APIPlayground
          test ! -e apps/playground/src/APIPlayground/examples
          test ! -e apps/playground/src/examples/computedExport.ts
          test ! -e apps/playground/src/examples/shorthands.ts
          test ! -e apps/playground/src/examples/index.ts
          test -e apps/playground/src/examples/CSSConverter/index.ts
          test -e apps/playground/src/examples/APIPlayground/index.ts
          count_source=$(find apps/playground/src/examples/APIPlayground -name source.tsx | wc -l)
          count_meta=$(find apps/playground/src/examples/APIPlayground -name meta.json | wc -l)
          test "$count_source" -eq 19
          test "$count_meta" -eq 19

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "moyarich"
          git config user.email "moyarich@hotmail.com"
          git add -A
          git commit -m "refactor(playground): group examples by playground"
          git push origin main
