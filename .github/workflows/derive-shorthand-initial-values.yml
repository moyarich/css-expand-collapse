name: Derive shorthand initial values

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/derive-shorthand-initial-values.yml

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:lib
      - name: Derive initial values
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { getLonghands, SHORTHAND_PROPERTIES } from './packages/css-expand-collapse/dist/index.js';
          const require = createRequire(import.meta.url);
          const props = require('mdn-data/css/properties.json');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'packages/css-expand-collapse/src/registry/shorthands';
          for (const shorthand of SHORTHAND_PROPERTIES) {
            const file = path.join(root, `${shorthand}.ts`);
            if (!fs.existsSync(file)) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes('initialValues')) continue;
            const longhands = getLonghands(shorthand);
            const values = longhands.map((longhand) => props[longhand]?.initial ?? null);
            console.log(JSON.stringify({ shorthand, longhands, values }));
          }
          NODE
