name: Publish GitHub package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: github-package-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify version tag
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/css-expand-collapse/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Show package version
        run: node -p "'Publishing @moyarich/css-expand-collapse@' + require('./packages/css-expand-collapse/package.json').version"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets._GITHUB_TOKEN || secrets._NODE_AUTH_TOKEN }}
          NPM_REGISTRY: https://npm.pkg.github.com
          NPM_TAG: ${{ inputs.tag || 'latest' }}
          NPM_ACCESS: public
        run: npm run publish:lib
