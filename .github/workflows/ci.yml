name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
      - name: Validate package and release archive
        run: npm run release:check
      - name: Build playground
        run: npm run build:playground
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test nested console object layout
        working-directory: apps/playground
        run: npm run test:browser
