name: Refactor API playground

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-api-playground.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update API playground imports
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/playground/src/App.tsx'): [
                  ('import { FunctionPlayground } from "./functionPlayground/FunctionPlayground";', 'import { APIPlayground } from "./APIPlayground";'),
                  ('<FunctionPlayground />', '<APIPlayground />'),
              ],
              Path('apps/playground/src/monaco.ts'): [
                  ('./functionPlayground/packageTypes', './APIPlayground/packageTypes'),
              ],
              Path('apps/playground/src/main.tsx'): [
                  ('./functionPlayground/styles.css', './APIPlayground/styles.css'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          rm -rf apps/playground/src/functionPlayground

          if grep -R "functionPlayground\|FunctionPlayground" apps/playground/src; then
            echo "Old functionPlayground references remain"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "moyarich"
          git config user.email "moyarich@hotmail.com"
          git add apps/playground/src
          git commit -m "refactor: split API playground and runner components"
          git push
