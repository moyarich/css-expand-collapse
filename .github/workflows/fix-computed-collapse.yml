name: Fix computed style collapse

on:
  push:
    paths:
      - .github/workflows/fix-computed-collapse.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix computed-style shorthand collapsing
        run: |
          node --input-type=module <<'EOF'
          import { promises as fs } from 'node:fs';

          const file = 'packages/css-expand-collapse/src/css.ts';
          let source = await fs.readFile(file, 'utf8');

          const normalizeAnchor = `function normalizeProperty(property: string): string {\n  return property.trim().toLowerCase();\n}\n\n`;
          const comparisonHelpers = `function canonicalizeCssValue(value: string): string {\n  try {\n    return generate(parse(value, { context: "value" })).trim();\n  } catch {\n    return value.trim();\n  }\n}\n\nfunction isTransparentBlack(value: string): boolean {\n  const normalized = value.toLowerCase();\n  return (\n    normalized === "transparent" ||\n    normalized === "rgba(0,0,0,0)" ||\n    normalized === "rgb(0 0 0/0)" ||\n    normalized === "rgb(0 0 0 / 0)"\n  );\n}\n\nfunction valuesEquivalent(property: string, left: string, right: string): boolean {\n  const a = canonicalizeCssValue(left);\n  const b = canonicalizeCssValue(right);\n  if (a === b) return true;\n\n  // Computed background-size commonly serializes the initial two-value form\n  // \`auto auto\` as the equivalent one-value form \`auto\`.\n  if (\n    property === "background-size" &&\n    ((a === "auto" && b === "auto auto") ||\n      (a === "auto auto" && b === "auto"))\n  ) {\n    return true;\n  }\n\n  // The CSS keyword transparent is transparent black. Chromium computed styles\n  // commonly serialize it as rgba(0, 0, 0, 0).\n  if (property === "background-color" && isTransparentBlack(a) && isTransparentBlack(b)) {\n    return true;\n  }\n\n  return false;\n}\n\n`;

          if (!source.includes(normalizeAnchor)) throw new Error('normalizeProperty anchor not found');
          source = source.replace(normalizeAnchor, normalizeAnchor + comparisonHelpers);

          source = source.replace(
            'return !current || current.value !== longhandValue || current.important !== important;',
            'return !current || !valuesEquivalent(longhand, current.value, longhandValue) || current.important !== important;',
          );
          source = source.replace(
            'if (current && current.value === value && current.important === important) continue;',
            'if (current && valuesEquivalent(property, current.value, value) && current.important === important) continue;',
          );

          const oldCollapseBlock = `function collapseBlock(children: any[], options?: TransformOptions): any[] {\n  const normalized = removeRedundantDeclarations(children, options);\n  const consumed = new Set<number>();\n  const replacements = new Map<number, any>();\n\n  // Plan first, emit second. A later complete longhand set may prove that an earlier\n  // shorthand is fully shadowed, so we need to know all removals before outputting it.\n  for (let index = 0; index < normalized.length; index += 1) {\n    if (consumed.has(index)) continue;\n\n    const collapsed = tryCollapseAt(normalized, index, consumed, options);\n    if (!collapsed) continue;\n\n    replacements.set(index, collapsed.node);\n    for (const matchedIndex of collapsed.indices) consumed.add(matchedIndex);\n    for (const shadowedIndex of collapsed.shadowedIndices) consumed.add(shadowedIndex);\n  }\n\n  const output: any[] = [];\n  for (let index = 0; index < normalized.length; index += 1) {\n    const replacement = replacements.get(index);\n    if (replacement) {\n      output.push(replacement);\n      continue;\n    }\n    if (!consumed.has(index)) output.push(normalized[index]);\n  }\n\n  return output;\n}\n`;

          const newCollapseBlock = `function collapseBlock(children: any[], options?: TransformOptions): any[] {\n  const consumed = new Set<number>();\n  const replacements = new Map<number, any>();\n\n  // Collapse complete longhand sets before deduping repeated values. Computed-style\n  // exports often contain an earlier shorthand followed by all of its resolved\n  // longhands. Some of those longhands may equal the earlier shorthand while others\n  // override it. Removing the equal declarations first would make the later set look\n  // incomplete and prevent replacing the earlier shorthand with the final value.\n  for (let index = 0; index < children.length; index += 1) {\n    if (consumed.has(index)) continue;\n\n    const collapsed = tryCollapseAt(children, index, consumed, options);\n    if (!collapsed) continue;\n\n    replacements.set(index, collapsed.node);\n    for (const matchedIndex of collapsed.indices) consumed.add(matchedIndex);\n    for (const shadowedIndex of collapsed.shadowedIndices) consumed.add(shadowedIndex);\n  }\n\n  const collapsedOutput: any[] = [];\n  for (let index = 0; index < children.length; index += 1) {\n    const replacement = replacements.get(index);\n    if (replacement) {\n      collapsedOutput.push(replacement);\n      continue;\n    }\n    if (!consumed.has(index)) collapsedOutput.push(children[index]);\n  }\n\n  // Then remove computed longhands that merely restate the shorthand. Comparison is\n  // syntax-normalized so harmless serialization differences do not keep duplicates.\n  return removeRedundantDeclarations(collapsedOutput, options);\n}\n`;

          if (!source.includes(oldCollapseBlock)) throw new Error('collapseBlock anchor not found');
          source = source.replace(oldCollapseBlock, newCollapseBlock);
          await fs.writeFile(file, source);

          await fs.writeFile(
            'packages/css-expand-collapse/tests/computed-export-collapse.test.ts',
            `import { describe, expect, it } from "vitest";\nimport { collapseCss } from "../src/index.js";\n\ndescribe("computed export shorthand collapse", () => {\n  it("merges an earlier inset shorthand with a complete later computed longhand set", () => {\n    const css = collapseCss(\`\n      .tip {\n        inset: 0px auto auto 50%;\n        top: 0px;\n        right: -27.5px;\n        bottom: -19.8px;\n        left: 0px;\n      }\n    \`);\n\n    expect(css).toContain("inset:0px -27.5px -19.8px 0px");\n    expect(css).not.toMatch(/[;{]top:/);\n    expect(css).not.toMatch(/[;{]right:/);\n    expect(css).not.toMatch(/[;{]bottom:/);\n    expect(css).not.toMatch(/[;{]left:/);\n  });\n\n  it("removes computed background longhands with equivalent browser serialization", () => {\n    const css = collapseCss(\`\n      .bubble {\n        background: none;\n        background-color: rgba(0, 0, 0, 0);\n        background-image: none;\n        background-position: 0% 0%;\n        background-repeat: repeat;\n        background-size: auto;\n      }\n    \`);\n\n    expect(css).toBe(".bubble{background:none}");\n  });\n\n  it("removes computed transition longhands despite comma whitespace differences", () => {\n    const css = collapseCss(\`\n      .bubble {\n        transition: translate 0.2s ease-out, scale 0.2s ease-out;\n        transition-property: translate, scale;\n        transition-duration: 0.2s, 0.2s;\n        transition-timing-function: ease-out, ease-out;\n      }\n    \`);\n\n    expect(css).toContain("transition:translate .2s ease-out,scale .2s ease-out");\n    expect(css).not.toContain("transition-property");\n    expect(css).not.toContain("transition-duration");\n    expect(css).not.toContain("transition-timing-function");\n  });\n});\n`,
          );
          EOF

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/css-expand-collapse/src/css.ts packages/css-expand-collapse/tests/computed-export-collapse.test.ts
          git commit -m "fix: collapse computed shorthand exports correctly"
          git push
