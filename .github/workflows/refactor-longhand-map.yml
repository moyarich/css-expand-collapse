name: Refactor shorthand longhands to maps

on:
  push:
    branches: [main]
    paths:
      - scripts/refactor-longhand-map.mjs
      - .github/workflows/refactor-longhand-map.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:lib
      - name: Prepare refactor generator
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/refactor-longhand-map.mjs')
          text = path.read_text()

          # Avoid nested template literals inside generated source strings.
          text = text.replace('return `${top} ${right}`;', 'return top + " " + right;')
          text = text.replace('return `${top} ${right} ${bottom}`;', 'return top + " " + right + " " + bottom;')
          text = text.replace('return second === longhands.get(properties[1]!) ? first! : `${first} / ${second}`;', 'return second === longhands.get(properties[1]!) ? first! : first + " / " + second;')

          # Use MDN metadata where available and preserve existing module defaults for
          # vendor-prefixed longhands missing from the metadata package.
          text = text.replace(
              'import fs from "node:fs";\n',
              'import fs from "node:fs";\nimport { createRequire } from "node:module";\n',
          )
          marker = 'const shorthandRoot = path.join(packageRoot, "src/registry/shorthands");\n'
          text = text.replace(
              marker,
              marker + '\nconst require = createRequire(import.meta.url);\nconst cssProperties = require("mdn-data/css/properties.json");\n',
          )
          start = text.index('function evaluateInitialValues')
          end = text.index('function mapDeclaration')
          replacement = '''function sourceInitialValues(text, names) {
            const match = text.match(/const initialValues\\s*=\\s*([\\s\\S]*?);/);
            if (!match) return [];
            let expression = match[1].trim();
            expression = expression
              .replace(/\\s+as const$/, "")
              .replace(/\\s+as readonly string\\[\\]$/, "");
            if (expression === 'longhands.map(() => "normal")') {
              return names.map(() => "normal");
            }
            if (!expression.startsWith("[")) return [];
            const values = Function(`"use strict"; return (${expression});`)();
            return Array.isArray(values)
              ? values.map((value) => value === null ? "initial" : String(value))
              : [];
          }

          function evaluateInitialValues(text, shorthand) {
            const names = getLonghands(shorthand);
            const sourceValues = sourceInitialValues(text, names);
            return names.map((longhand, index) => {
              const initial = cssProperties[longhand]?.initial;
              if (initial != null) {
                return initial === "dependsOnUserAgent" ? "initial" : String(initial);
              }
              const sourceValue = sourceValues[index];
              if (sourceValue == null) {
                throw new Error(`Missing initial value for ${shorthand} -> ${longhand}`);
              }
              return sourceValue;
            });
          }

          '''
          text = text[:start] + replacement + text[end:]

          # A custom module may derive an ordered values array from the map for its
          # positional grammar. Only exporting an initialValues metadata field is forbidden.
          text = text.replace(
              'if (/\\binitialValues\\b/.test(exportBlock)) throw new Error(`${name} still exports initialValues metadata`);',
              'if (/^\\s*initialValues,\\s*$/m.test(exportBlock)) throw new Error(`${name} still exports initialValues metadata`);',
          )
          path.write_text(text)
          PY
      - name: Apply LonghandMap refactor
        run: node scripts/refactor-longhand-map.mjs
      - name: Verify no independent module initialValues metadata remains
        run: |
          if grep -R "readonly initialValues" packages/css-expand-collapse/src/registry; then
            echo "ShorthandModule still exposes initialValues"
            exit 1
          fi
          if grep -R -E '^[[:space:]]*initialValues,[[:space:]]*$' packages/css-expand-collapse/src/registry/shorthands; then
            echo "A shorthand still exports initialValues"
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Remove temporary refactor files
        run: |
          rm scripts/refactor-longhand-map.mjs
          rm .github/workflows/refactor-longhand-map.yml
      - name: Commit validated refactor
        run: |
          git config user.name "moyarich"
          git config user.email "moyarich@hotmail.com"
          git add -A
          git commit -m "refactor: pair longhands with initial values in maps"
          git push
