name: CI / CSS semantics

on:
  push:
    branches: [main]
    paths:
      - "packages/css-expand-collapse/**"
      - "package*.json"
      - ".github/workflows/ci_css_semantics.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:semantics --workspace @moyarich/css-expand-collapse
