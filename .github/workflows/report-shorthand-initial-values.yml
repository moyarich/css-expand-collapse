name: Audit shorthand initial values

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-shorthand-initial-values.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report modules missing initialValues
        run: |
          python <<'PY'
          from pathlib import Path
          root = Path('packages/css-expand-collapse/src/registry/shorthands')
          files = sorted(root.glob('*.ts'))
          missing = []
          present = []
          for path in files:
              text = path.read_text()
              if 'satisfies ShorthandModule' not in text:
                  continue
              (present if 'initialValues' in text else missing).append(path.name)
          print(f'MODULES={len(present)+len(missing)}')
          print(f'WITH_INITIAL_VALUES={len(present)}')
          print(f'MISSING_INITIAL_VALUES={len(missing)}')
          print('--- missing ---')
          for name in missing:
              print(name)
          PY
