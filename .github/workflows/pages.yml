name: Deploy CSS Expand Collapse playground

on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "packages/css-expand-collapse/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_github-pages.yml@v0.2.0
    with:
      node-version: "24"
      build-command: npm run build:playground
      output-directory: apps/playground/dist
