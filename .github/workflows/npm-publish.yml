name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      registry:
        description: Publish destination
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
          - both
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: package-publish
  cancel-in-progress: false

env:
  PACKAGE_DIRECTORY: packages/css-expand-collapse
  NPM_ACCESS: public

jobs:
  publish-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify version tag
        run: |
          PACKAGE_VERSION="$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          PRIMARY_GITHUB_TOKEN: ${{ secrets['_GITHUB_TOKEN'] }}
          FALLBACK_GITHUB_TOKEN: ${{ secrets['_NODE_AUTH_TOKEN'] }}
          NPM_REGISTRY: https://npm.pkg.github.com
          NPM_TAG: latest
        run: |
          export _GITHUB_TOKEN="${PRIMARY_GITHUB_TOKEN:-$FALLBACK_GITHUB_TOKEN}"
          npm run publish:lib

  publish-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PUBLISH_TARGET: ${{ github.event.inputs.registry }}
      NPM_TAG: ${{ github.event.inputs.tag }}
      PRIMARY_GITHUB_TOKEN: ${{ secrets['_GITHUB_TOKEN'] }}
      FALLBACK_GITHUB_TOKEN: ${{ secrets['_NODE_AUTH_TOKEN'] }}
      PRIMARY_NPM_TOKEN: ${{ secrets['_NPM_TOKEN'] }}
      FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Ensure staged publishing CLI support
        if: github.event.inputs.registry != 'github'
        run: npm install --global npm@">=11.15.0 <12"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Publish selected registry
        run: |
          publish_github() {
            export _GITHUB_TOKEN="${PRIMARY_GITHUB_TOKEN:-$FALLBACK_GITHUB_TOKEN}"
            export NPM_REGISTRY="https://npm.pkg.github.com"
            npm run publish:lib
          }

          stage_npm() {
            export _NPM_TOKEN="${PRIMARY_NPM_TOKEN:-$FALLBACK_NPM_TOKEN}"
            export NPM_REGISTRY="https://registry.npmjs.org"
            npm run publish:lib
          }

          case "$PUBLISH_TARGET" in
            github)
              publish_github
              ;;
            npm)
              stage_npm
              ;;
            both)
              publish_github
              stage_npm
              ;;
            *)
              echo "Unsupported publish target: $PUBLISH_TARGET"
              exit 1
              ;;
          esac
