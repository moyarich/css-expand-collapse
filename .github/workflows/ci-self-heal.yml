name: CI self-heal

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed-run-id:
        description: Failed CI run on main
        type: number
        required: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  self-heal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    uses: moyarich/reusable-workflows/.github/workflows/reusable_ci-self-heal.yml@feat/ci-self-heal
    with:
      failed-run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.failed-run-id || github.event.workflow_run.id }}
      package-directory: apps/playground
      verify-command: |
        npm audit --audit-level=high
        npm run release:check
        npm run lint
        npm run typecheck
        npm run build:playground
        npm run test
    secrets: inherit
