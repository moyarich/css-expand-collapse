name: Release or publish package

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release a new version or publish the existing version
        required: true
        default: publish
        type: choice
        options:
          - publish
          - release
      version:
        description: Version bump used by release; ignored when publishing
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

permissions:
  contents: write
  packages: write

concurrency:
  group: package-release-publish
  cancel-in-progress: false

env:
  NPM_ACCESS: public

jobs:
  publish-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest
    env:
      PUBLISH_TARGET: github
      NPM_TAG: latest
      _GITHUB_TOKEN: ${{ secrets['_GITHUB_TOKEN'] }}
      _NPM_TOKEN: ${{ secrets['_NPM_TOKEN'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve package
        run: echo "PACKAGE_DIRECTORY=packages/css-expand-collapse" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Publish existing version
        run: npm run publish:lib

  release-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release'
    runs-on: ubuntu-latest
    env:
      PUBLISH_TARGET: github
      NPM_TAG: latest
      _GITHUB_TOKEN: ${{ secrets['_GITHUB_TOKEN'] }}
      _NPM_TOKEN: ${{ secrets['_NPM_TOKEN'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Manual releases must run from a branch."
            exit 1
          fi

          echo "PACKAGE_DIRECTORY=packages/css-expand-collapse" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release commit and tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: npm run release -- css-expand-collapse="$RELEASE_VERSION"

      - name: Push release commit and tag
        run: git push origin "HEAD:$GITHUB_REF_NAME" --follow-tags

      - name: Publish released version
        run: npm run publish:lib
