name: Refactor API playground examples

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ github.event.head_commit.message == 'chore: generate api example fixtures' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Split API examples into fixtures
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path("apps/playground/src")
          old = root / "examples/functions.ts"
          text = old.read_text()

          id_matches = list(re.finditer(r'\bid:\s*"([^"]+)"', text))
          if not id_matches:
              raise SystemExit("No function examples found")

          target = root / "APIPlayground/examples"
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          for order, match in enumerate(id_matches):
              start = match.start()
              end = id_matches[order + 1].start() if order + 1 < len(id_matches) else text.index("\n];", start)
              segment = text[start:end]

              example_id = match.group(1)
              label_match = re.search(r'\blabel:\s*"([^"]+)"', segment)
              description_match = re.search(r'\bdescription:\s*"([^"]+)"', segment)
              if not label_match or not description_match:
                  raise SystemExit(f"Missing metadata for {example_id}")

              marker = "source: `"
              source_start = segment.find(marker)
              if source_start == -1:
                  raise SystemExit(f"Missing source for {example_id}")
              source_start += len(marker)

              cursor = source_start
              source_end = -1
              while cursor < len(segment):
                  if segment[cursor] == "`":
                      slashes = 0
                      probe = cursor - 1
                      while probe >= source_start and segment[probe] == "\\":
                          slashes += 1
                          probe -= 1
                      if slashes % 2 == 0:
                          source_end = cursor
                          break
                  cursor += 1
              if source_end == -1:
                  raise SystemExit(f"Unterminated source for {example_id}")

              source = segment[source_start:source_end].replace("\\`", "`")
              folder = target / example_id
              folder.mkdir()
              (folder / "source.tsx").write_text(source.rstrip() + "\n")
              (folder / "meta.json").write_text(json.dumps({
                  "id": example_id,
                  "label": label_match.group(1),
                  "description": description_match.group(1),
                  "order": order,
              }, indent=2) + "\n")

          (target / "index.ts").write_text('''export interface FunctionExampleMeta {\n  id: string;\n  label: string;\n  description: string;\n  order: number;\n}\n\nexport interface FunctionExample {\n  id: string;\n  label: string;\n  description: string;\n  source: string;\n}\n\nconst sourceModules = import.meta.glob("./*/source.tsx", {\n  query: "?raw",\n  import: "default",\n  eager: true,\n}) as Record<string, string>;\n\nconst metadataModules = import.meta.glob("./*/meta.json", {\n  import: "default",\n  eager: true,\n}) as Record<string, FunctionExampleMeta>;\n\nexport const FUNCTION_EXAMPLES: readonly FunctionExample[] = Object.entries(metadataModules)\n  .map(([path, metadata]) => {\n    const id = path.split("/").at(-2)!;\n    const source = sourceModules[`./${id}/source.tsx`];\n    if (!source) throw new Error(`Missing source.tsx for API example: ${id}`);\n    if (metadata.id !== id) throw new Error(`API example metadata id mismatch: ${id}`);\n    return { ...metadata, source };\n  })\n  .sort((a, b) => a.order - b.order)\n  .map(({ order: _order, ...example }) => example);\n\nexport const DEFAULT_FUNCTION_EXAMPLE = FUNCTION_EXAMPLES.find(\n  (example) => example.id === "expand-shorthand",\n)!;\n''')

          api = root / "APIPlayground/APIPlayground.tsx"
          api_text = api.read_text()
          api_text = api_text.replace('import {\n  DEFAULT_FUNCTION_EXAMPLE,\n  FUNCTION_EXAMPLES,\n  getFunctionExample,\n} from "../examples";', 'import { DEFAULT_FUNCTION_EXAMPLE, FUNCTION_EXAMPLES } from "./examples";')
          api_text = api_text.replace('getFunctionExample(selectedExample) ?? DEFAULT_FUNCTION_EXAMPLE', 'FUNCTION_EXAMPLES.find((item) => item.id === selectedExample) ?? DEFAULT_FUNCTION_EXAMPLE')
          api.write_text(api_text)

          examples_index = root / "examples/index.ts"
          index_text = examples_index.read_text()
          index_text = re.sub(r'\nexport \{\n  DEFAULT_FUNCTION_EXAMPLE,\n  FUNCTION_EXAMPLES,\n  getFunctionExample,\n  type FunctionExample,\n\} from "\./functions\.js";\n', '\n', index_text)
          examples_index.write_text(index_text)

          old.unlink()
          PY

      - name: Verify fixture structure
        run: |
          test ! -e apps/playground/src/examples/functions.ts
          test -e apps/playground/src/APIPlayground/examples/index.ts
          count_source=$(find apps/playground/src/APIPlayground/examples -name source.tsx | wc -l)
          count_meta=$(find apps/playground/src/APIPlayground/examples -name meta.json | wc -l)
          test "$count_source" -eq 19
          test "$count_meta" -eq 19
          for dir in apps/playground/src/APIPlayground/examples/*/; do
            test -f "${dir}source.tsx"
            test -f "${dir}meta.json"
          done

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "moyarich"
          git config user.email "moyarich@hotmail.com"
          git add -A
          git commit -m "refactor(playground): split API examples into source fixtures"
          git push origin main
