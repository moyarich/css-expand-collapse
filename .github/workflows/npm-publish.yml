name: Release or publish package

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release a new version or publish the existing version
        required: true
        default: publish
        type: choice
        options:
          - publish
          - release
      package-directory:
        description: Package location
        required: true
        default: packages/css-expand-collapse
        type: string
      version:
        description: Release version strategy; ignored when publishing
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
          - manual
      manual-version:
        description: Exact SemVer when version=manual; publish override when action=publish
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: package-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.inputs.action == 'publish'
    uses: moyarich/dev-toolkit/.github/workflows/npm-publish.yml@main
    with:
      package-directory: ${{ github.event.inputs.package-directory }}
      version: ${{ github.event.inputs.manual-version }}
      registry: github
      tag: latest
    secrets:
      github-token: ${{ secrets['_GITHUB_TOKEN'] }}

  release:
    if: github.event.inputs.action == 'release'
    uses: moyarich/dev-toolkit/.github/workflows/npm-release.yml@main
    with:
      package-directory: ${{ github.event.inputs.package-directory }}
      version: ${{ github.event.inputs.version == 'manual' && github.event.inputs.manual-version || github.event.inputs.version }}
      auto-publish: true
      registry: github
      tag: latest
    secrets:
      github-token: ${{ secrets['_GITHUB_TOKEN'] }}
