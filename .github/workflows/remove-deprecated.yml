name: Remove deprecated compatibility code

on:
  push:
    paths:
      - .github/workflows/remove-deprecated.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove deprecated compatibility layer
        run: |
          node --input-type=module <<'EOF'
          import { promises as fs } from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const read = (file) => fs.readFile(path.join(root, file), 'utf8');
          const write = (file, content) => fs.writeFile(path.join(root, file), content);

          const shorthandDir = path.join(root, 'packages/css-expand-collapse/src/registry/shorthands');
          const shorthandFiles = (await fs.readdir(shorthandDir))
            .filter((name) => name.endsWith('.ts') && name !== 'index.ts');

          for (const name of shorthandFiles) {
            const file = path.join(shorthandDir, name);
            let source = await fs.readFile(file, 'utf8');

            source = source.replaceAll('ShorthandDefinition', 'ShorthandModule');

            source = source.replace(
              /import \{([\s\S]*?)\} from "\.\.\/expanders\.js";/g,
              (match, body) => {
                const names = body
                  .split(',')
                  .map((part) => part.trim())
                  .filter(Boolean)
                  .filter((part) => part !== 'withCssomFallback');
                return names.length
                  ? `import { ${names.join(', ')} } from "../expanders.js";`
                  : '';
              },
            );

            source = source.replace(
              /^(\s*const\s+expand\s*=\s*)withCssomFallback\((.+)\);$/gm,
              '$1$2;',
            );

            if (source.includes('withCssomFallback')) {
              throw new Error(`Unconverted withCssomFallback usage in ${name}`);
            }

            await fs.writeFile(file, source, 'utf8');
          }

          await write(
            'packages/css-expand-collapse/src/registry/types.ts',
            `export type {
            DeclarationMap,
            ShorthandCollapseContext,
            ShorthandCollapser,
            ShorthandExpandContext,
            ShorthandExpander,
            ShorthandModule,
            ShorthandModuleMap,
            ShorthandStrategy,
            TransformableShorthandModule,
            TransformableShorthandModuleMap,
          } from "./module.js";
          `,
          );

          {
            const file = 'packages/css-expand-collapse/src/registry/index.ts';
            let source = await read(file);
            source = source.replace(
              'import type { ShorthandDefinition, ShorthandDefinitionMap } from "./types.js";\n',
              '',
            );
            source = source.replace(/\s+ShorthandDefinition,\n\s+ShorthandDefinitionMap,\n/g, '\n');
            source = source.replaceAll('ShorthandDefinitionMap', 'TransformableShorthandModuleMap');
            source = source.replaceAll('ShorthandDefinition', 'TransformableShorthandModule');
            await write(file, source);
          }

          {
            const file = 'packages/css-expand-collapse/src/core.ts';
            let source = await read(file);
            source = source.replaceAll('ShorthandDefinition', 'TransformableShorthandModule');
            source = source.replace(
              /\n\/\*\* @deprecated Use `TransformOptions`\. \*\/[\s\S]*?\n}\n\nexport interface CollapseResult/,
              '\nexport interface CollapseResult',
            );
            source = source.replaceAll('CssomOptions', 'TransformOptions');
            await write(file, source);
          }

          {
            const file = 'packages/css-expand-collapse/src/registry/expanders.ts';
            let source = await read(file);
            source = source.replace(
              /\n\/\*\*[\s\S]*?internal compatibility alias[\s\S]*?export function withCssomFallback\(expand: ShorthandExpander\): ShorthandExpander \{\n  return expand;\n}\n\n\/\*\* @deprecated[\s\S]*?export const expandCssom: ShorthandExpander = \(\) => null;\n/,
              '\n',
            );
            await write(file, source);
          }

          {
            const file = 'packages/css-expand-collapse/src/index.ts';
            let source = await read(file);
            source = source.replace(/\s+CssomOptions,\n/g, '');
            source = source.replace(
              /\n\/\/ Deprecated compatibility helpers\.[\s\S]*?export type \{ RuntimeCssomOptions \} from "\.\/runtime\.js";\n/,
              '\n',
            );
            await write(file, source);
          }

          await fs.rm(path.join(root, 'packages/css-expand-collapse/src/runtime.ts'));
          await fs.rm(path.join(root, 'packages/css-expand-collapse/tests/runtime.test.ts'));

          for (const file of [
            'README.md',
            'packages/css-expand-collapse/README.md',
          ]) {
            let source = await read(file);
            source = source.replaceAll('supportsRuntimeTransform', 'supportsTransform');
            await write(file, source);
          }

          for (const file of [
            'docs/README-dev.md',
            'packages/css-expand-collapse/src/registry/README.md',
          ]) {
            let source = await read(file);
            source = source.replace(
              /\n`ShorthandDefinition` remains only as a compatibility alias for `TransformableShorthandModule`\. New shorthand modules should use `ShorthandModule` directly\.\n/g,
              '\n',
            );
            source = source.replaceAll('ShorthandDefinition', 'ShorthandModule');
            source = source.replace(
              /import \{ expandQuad, withCssomFallback \} from "\.\.\/expanders\.js";/g,
              'import { expandQuad } from "../expanders.js";',
            );
            source = source.replace(
              /import \{ withCssomFallback \} from "\.\.\/expanders\.js";\n/g,
              '',
            );
            source = source.replaceAll(
              'expand: withCssomFallback(expandQuad(longhands)),',
              'expand: expandQuad(longhands),',
            );
            source = source.replaceAll(
              'expand: withCssomFallback(expandPure),',
              'expand: expandPure,',
            );
            source = source.replaceAll(
              'const expand = withCssomFallback(expandQuad(longhands));',
              'const expand = expandQuad(longhands);',
            );
            await write(file, source);
          }

          const forbidden = [
            '@deprecated',
            'CssomOptions',
            'RuntimeCssomOptions',
            'hasCssomSupport',
            'supportsRuntimeTransform',
            'ShorthandDefinition',
            'withCssomFallback',
            'expandCssom',
          ];

          const checkFiles = [];
          async function collect(dir) {
            for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name === 'node_modules' || entry.name === '.git') continue;
                await collect(full);
              } else if (/\.(ts|tsx|js|mjs|md)$/.test(entry.name)) {
                checkFiles.push(full);
              }
            }
          }
          await collect(path.join(root, 'packages/css-expand-collapse'));
          checkFiles.push(path.join(root, 'README.md'));
          checkFiles.push(path.join(root, 'docs/README-dev.md'));

          for (const file of checkFiles) {
            const source = await fs.readFile(file, 'utf8');
            for (const token of forbidden) {
              if (source.includes(token)) {
                throw new Error(`${token} remains in ${path.relative(root, file)}`);
              }
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: remove deprecated compatibility code"
          git push
