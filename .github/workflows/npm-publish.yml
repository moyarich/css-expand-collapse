name: Release or publish package

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release a new version or publish an existing release
        required: true
        default: publish
        type: choice
        options:
          - publish
          - release
      package-directory:
        description: Package location
        required: true
        default: packages/css-expand-collapse
        type: string
      version:
        description: Release bump strategy (ignored for publish)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
          - manual
      manual-version:
        description: Exact version for manual release or publish
        required: false
        type: string
      dry-run:
        description: Preview without creating a release or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: package-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.action == 'publish'
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@v0.2.0
    with:
      package-directory: ${{ inputs.package-directory }}
      version-mode: ${{ inputs.manual-version != '' && 'exact' || 'package-json' }}
      exact-version: ${{ inputs.manual-version }}
      dry-run: ${{ inputs.dry-run }}
      registry: github
      tag: latest

  release:
    if: inputs.action == 'release'
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-release.yml@v0.2.0
    with:
      package: ${{ inputs.package-directory }}
      version-mode: ${{ inputs.version == 'manual' && 'exact' || 'bump' }}
      version-bump: ${{ inputs.version == 'manual' && 'patch' || inputs.version }}
      exact-version: ${{ inputs.manual-version }}
      dry-run: ${{ inputs.dry-run }}
