name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  node:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@v0.2.0
    with:
      node-version: "24"
      package-directory: "."

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm audit --audit-level=high
      - run: npm run release:check
      - run: npm run build:playground
      # Install browsers using the Playwright dependency resolved by Vitest's
      # browser provider. A separate npx CLI can download a different revision.
      - name: Install matching Playwright Chromium
        run: |
          node --input-type=module -e '
            import { createRequire } from "node:module";
            import { dirname, join } from "node:path";
            import { spawnSync } from "node:child_process";
            const require = createRequire(import.meta.url);
            const provider = require.resolve("@vitest/browser-playwright");
            const fromProvider = createRequire(provider);
            const playwrightPackage = fromProvider.resolve("playwright/package.json");
            const cli = join(dirname(playwrightPackage), "cli.js");
            const result = spawnSync(process.execPath, [cli, "install", "--with-deps", "chromium"], { stdio: "inherit" });
            process.exit(result.status ?? 1);
          '
      - working-directory: apps/playground
        run: npm run test-storybook
      - working-directory: apps/playground
        run: npm run test:browser
